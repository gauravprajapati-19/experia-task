# Local PostgreSQL 16 for development. Optional: DATABASE_URL / TEST_DATABASE_URL can point at any PostgreSQL.
# Credentials below are for this throwaway local container only.
services:
  postgres:
    image: postgres:16
    container_name: experia-postgres
    environment:
      POSTGRES_USER: experia
      POSTGRES_PASSWORD: experia
      POSTGRES_DB: experia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates the separate test database on first start
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experia -d experia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
